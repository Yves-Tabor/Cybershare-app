services:
  # Frontend - Static Site
  - type: web
    name: cybershare
    runtime: static
    buildCommand: cd frontend && pnpm install && pnpm build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https: wss: ws:; object-src 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload

  # Backend - Web Service
  - type: web
    name: cybershare-backend
    runtime: node
    buildCommand: cd backend && pnpm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
